      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controller_restapi_v1_admin.dashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Admin dashboard
      tags:
      - admin
  /admin/languages:

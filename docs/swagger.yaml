        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/v1.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.Error'
      security:
      - BearerAuth: []
      summary: Update language
      tags:
      - admin-languages
  /admin/levels:
    get:
      description: Return levels, optionally filtered by their source language
      operationId: admin-list-levels
      parameters:
      - description: Source language ID
        in: query
        name: language_id
        type: integer
      produces:
      - application/json
      responses:
        "200":

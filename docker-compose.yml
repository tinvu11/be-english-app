x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"


x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db"

  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"
  # Tracing
  TRACING_ENABLED: "true"
  TRACING_OTLP_ENDPOINT: "jaeger:4317"
  TRACING_OTLP_INSECURE: "true"
  TRACING_SAMPLE_RATE: "1.0"  # DON'T set to 1.0 in production, use a lower value like 0.1 or 0.01
  # Firebase Authentication
  FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-service-account.json"
  # yt-dlp service
  YTDLP_BASE_URL: "http://ytdlp:8081"
  YTDLP_TIMEOUT_SECONDS: "300"
  GROQ_BASE_URL: "https://api.groq.com"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  GROQ_WHISPER_MODEL: "whisper-large-v3-turbo"
  GROQ_TIMEOUT_SECONDS: "300"


services:
  db:
    container_name: db
    image: postgres:18.4-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me


  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  ytdlp:
    container_name: ytdlp
    platform: linux/amd64
    build:
      context: .
      target: ytdlp-service
    ports:
      - "8081:8081"
    environment:
      YTDLP_SERVICE_PORT: "8081"
      YTDLP_TIMEOUT_SECONDS: "300"
      YTDLP_MAX_FILE_MB: "100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      app_network:
        aliases:
          - ytdlp.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      target: app
    environment:
      <<: *x-backend-app-environment
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      jaeger:
        condition: service_started
      ytdlp:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.4-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:

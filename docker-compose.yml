x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "db"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_USER: "user"


x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  # App
  APP_NAME: "go-clean-template"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # PG
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55%40w0rd@db:5432/db"

  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"
  # Firebase Authentication
  FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
  GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-service-account.json"
  # Local yt-dlp process
  YTDLP_BINARY_PATH: "yt-dlp"
  YTDLP_TIMEOUT_SECONDS: "300"
  YTDLP_MAX_FILE_MB: "100"
  YTDLP_POT_SERVER_URL: "http://pot-provider:4416"
  QUOTA_YOUTUBE_IMPORT_DAILY: "3"
  QUOTA_SHADOWING_ASSESSMENT_DAILY: "5"
  GROQ_BASE_URL: "https://api.groq.com"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  GROQ_WHISPER_MODEL: "whisper-large-v3-turbo"
  GROQ_TIMEOUT_SECONDS: "300"


services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-node
    ports:
      - "127.0.0.1:4416:4416"
    networks:
      - app_network

  db:
    container_name: db
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me


  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      target: app
    environment:
      <<: *x-backend-app-environment
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      pot-provider:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.31.3-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8088:80"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
